<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2F2F2"/>
      <stop offset="100%" stop-color="#DCDCDC"/>
    </linearGradient>
    <linearGradient id="poleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#FFF2A8"/>
      <stop offset="100%" stop-color="#C29B27"/>
    </linearGradient>
  </defs>
  <!-- Flagpole Finial Ball -->
  <circle cx="34" cy="22" r="6" fill="url(#poleGrad)" filter="url(#shadow)"/>
  <!-- Pole -->
  <rect x="31" y="24" width="6" height="88" rx="3" fill="url(#poleGrad)" filter="url(#shadow)"/>
  <!-- Waving White Surrender Flag -->
  <path d="M37 28 C 55 23, 70 35, 92 29 C 97 28, 102 30, 102 35 L 98 73 C 78 77, 62 65, 42 71 C 39 72, 37 71, 37 68 Z" fill="url(#flagGrad)" stroke="#B5B5B5" stroke-width="2" filter="url(#shadow)"/>
</svg>
